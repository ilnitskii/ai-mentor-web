prompt: Для каждой продажи выведите сумму продаж её клиента, сохранив каждую исходную строку.
answer_type: code_as_text
options: []
checker:
  mode: normalized
  expected_answers:
    - SUM(amount) OVER (PARTITION BY customer_id)
