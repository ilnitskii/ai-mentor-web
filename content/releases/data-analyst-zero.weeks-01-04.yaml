schema_version: 1
track_id: data-analytics.zero-to-job
release_version: 2
title: С нуля до Data Analyst — недели 1–4
start_week: 1
end_week: 4
status: published
weeks:
  - week: 1
    title: Старт и грамотность работы с данными
    outcome: Подготовить паспорт небольшого датасета и выполнить пять проверок качества.
    days:
      - day: 1
        topic_id: foundations.data-tables
        title: Строка, столбец и зерно таблицы
        minutes: 6
        body: |
          # Как аналитик видит таблицу

          Таблица описывает объекты или события. Одна строка — одно наблюдение, столбец — один признак, а ячейка — значение признака для наблюдения. Смысл одной строки называют **зерном**.

          | sale_id | date | city | amount |
          | --- | --- | --- | ---: |
          | 101 | 2026-08-15 | Москва | 1200 |
          | 102 | 2026-08-15 | Казань | 900 |

          Здесь зерно — одна продажа. До расчётов сформулируйте зерно одним предложением и найдите поле, которое должно однозначно идентифицировать строку.
        check_question: Что описывает одна строка в примере?
        check_answers: [одну продажу, продажу, одно событие продажи]
        check_options: [Одну продажу, Один город, Один столбец]
        knowledge:
          - [Что такое зерно таблицы?, Смысл одной строки., Без зерна нельзя корректно считать и объединять данные.]
          - [Что обычно представляет столбец?, Один признак наблюдения., Столбец city хранит один и тот же вид признака для всех продаж.]
          - [Что представляет ячейка?, Значение признака для конкретной строки., Ячейка находится на пересечении наблюдения и признака.]
          - [Какой кандидат на ключ есть в примере?, sale_id, Идентификатор продажи должен отличать одну продажу от другой.]
          - [Почему зерно формулируют до расчётов?, Чтобы понимать смысл количества строк и агрегатов., Иначе одна и та же сущность может быть посчитана несколько раз.]
        task:
          answer_type: choice
          prompt: В таблице каждая строка имеет уникальный sale_id. Выберите зерно таблицы.
          options: [Одна продажа, Один город, Один месяц]
          expected: [Одна продажа]
          reference: Одна строка описывает одну продажу.
      - day: 2
        topic_id: foundations.data-types
        title: Типы данных и форматы
        minutes: 7
        body: |
          # Тип определяет допустимые операции

          Число можно складывать, дату — сравнивать по времени, текст — искать и объединять. Вид значения не гарантирует правильный тип: `"1200"` может быть текстом, а `01.02.03` — неоднозначной датой.

          Различайте **смысл** и **хранение**. Телефон состоит из цифр, но является идентификатором: складывать телефоны бессмысленно. Сумма заказа — числовая мера. Дату храните в однозначном формате `YYYY-MM-DD`, а категорию — в согласованном словаре.
        check_question: Почему номер телефона обычно считают текстом, а не числом?
        check_answers: [это идентификатор, номер телефона это идентификатор, его не складывают, телефоны не складывают]
        check_options: [Потому что это идентификатор, Потому что в нём мало цифр, Потому что его всегда заполняют вручную]
        knowledge:
          - [Какой тип подходит сумме заказа?, Число., С суммой выполняют арифметические операции.]
          - [Какой тип подходит номеру телефона?, Текст или идентификатор., Арифметика для номера не имеет смысла.]
          - [Какой формат даты однозначнее?, YYYY-MM-DD, Порядок год-месяц-день не зависит от локали.]
          - [Почему «1200 руб.» не готово к суммированию?, В значении смешаны число и текст., Валюту хранят отдельно или очищают строку.]
          - [Что важнее внешнего вида значения?, Его смысл и допустимые операции., Цифры могут обозначать категорию или идентификатор.]
        task:
          answer_type: choice
          prompt: Какой столбец следует хранить как текст, даже если он состоит только из цифр?
          options: [Количество товаров, Телефон клиента, Сумма заказа]
          expected: [Телефон клиента]
          reference: Телефон — идентификатор; его не складывают и ведущий ноль нельзя терять.
      - day: 3
        topic_id: foundations.missing-duplicates
        title: Пропуски и дубликаты
        minutes: 7
        body: |
          # Две разные проблемы качества

          Пропуск означает отсутствие известного значения. Причины различаются: значение не собирали, оно неприменимо или потерялось. Поэтому нельзя автоматически заменять все пропуски нулём.

          Дубликат определяется относительно зерна. Полностью одинаковые строки могут быть технической копией, а одинаковые customer_id — нормальны, если зерно таблицы «одна покупка». Сначала назовите ключ зерна, затем проверяйте его уникальность.
        check_question: Можно ли всегда заменить пропуск нулём?
        check_answers: [нет, нельзя, нет нельзя, не всегда]
        check_options: [Нет, смысл пропуска и нуля может различаться, Да, если столбец числовой, Да, если строк больше ста]
        knowledge:
          - [Что означает пропуск?, Значение отсутствует или неизвестно., Причину пропуска нужно выяснить до обработки.]
          - [Когда ноль не равен пропуску?, Когда ноль является измеренным значением., Нулевые продажи и неизвестные продажи — разные факты.]
          - [Относительно чего определяют дубликат?, Относительно зерна и ключа., Повтор customer_id допустим при зерне «заказ».]
          - [Что проверить перед удалением дублей?, Какие поля образуют ключ строки., Иначе можно удалить реальные повторные события.]
          - [Что делать с пропусками сначала?, Посчитать их и изучить причины., Способ обработки зависит от механизма появления.]
        task:
          answer_type: choice
          prompt: В столбце city 100 строк, из них 7 пустых. Сколько пропусков нужно указать в отчёте качества?
          options: ["7", "93", "100"]
          expected: ["7"]
          reference: Семь пустых значений означают 7 пропусков.
      - day: 4
        topic_id: foundations.quality-checks
        title: Пять базовых проверок качества
        minutes: 7
        body: |
          # Минимальный data quality checklist

          Перед анализом проверьте: соответствие зерну, уникальность ключа, полноту обязательных полей, допустимость значений и согласованность типов/форматов. Дополнительно полезно оценить свежесть данных.

          Проверка должна быть измеримой: не «данные хорошие», а «sale_id уникален в 10 000 из 10 000 строк» или «amount неотрицателен во всех строках». Для каждой ошибки зафиксируйте количество, пример и решение.
        check_question: Назовите проверку, которая обнаружит отрицательную сумму продажи.
        check_answers: [допустимость значений, проверка диапазона, диапазон, amount неотрицателен, проверка на отрицательные значения]
        check_options: [Проверка допустимого диапазона, Проверка кодировки файла, Проверка сортировки строк]
        knowledge:
          - [Что проверяет уникальность?, Отсутствие повторов ключа зерна., Для одной продажи sale_id должен быть уникален.]
          - [Что проверяет полнота?, Наличие значений в обязательных полях., Пропуски считают по каждому важному столбцу.]
          - [Что проверяет допустимость?, Принадлежность значений правилам и диапазонам., Сумма продажи обычно не должна быть отрицательной.]
          - [Как формулировать проверку?, Как измеримое условие с результатом., Число нарушений позволяет воспроизвести вывод.]
          - [Зачем сохранять пример ошибки?, Чтобы проверить причину и способ исправления., Один пример делает агрегированный счёт понятным.]
        task:
          answer_type: choice
          prompt: Какая проверка качества для столбца sale_id сформулирована измеримо?
          options: [Количество уникальных sale_id равно количеству строк и пропусков нет, sale_id выглядит правильно, Иногда проверять sale_id вручную]
          expected: [Количество уникальных sale_id равно количеству строк и пропусков нет]
          reference: Количество уникальных sale_id должно равняться количеству строк; пропуски не допускаются.
      - day: 5
        topic_id: foundations.data-passport
        title: CSV, XLSX и паспорт датасета
        minutes: 7
        body: |
          # Сделайте данные понятными другому человеку

          CSV — текстовый табличный формат: важны кодировка, разделитель и десятичный знак. XLSX может хранить формулы, форматирование и несколько листов, поэтому внешний вид способен скрывать исходное значение.

          Паспорт датасета содержит источник, период, зерно, число строк, ключ, словарь полей, ограничения и результаты проверок качества. Он отделяет факты о данных от выводов анализа и помогает воспроизвести работу.
        check_question: Какой пункт паспорта объясняет смысл одной строки?
        check_answers: [зерно, зерно таблицы, описание зерна]
        check_options: [Зерно таблицы, Кодировка файла, Цвет заголовка]
        knowledge:
          - [Что нужно знать при чтении CSV?, Кодировку и разделитель., Неверные параметры искажают столбцы и символы.]
          - [Что дополнительно хранит XLSX?, Формулы, форматирование и листы., Отображаемое значение может зависеть от формулы.]
          - [Что обязательно указать в паспорте?, Источник, период, зерно и ключ., Эти поля задают контекст набора данных.]
          - [Зачем нужен словарь полей?, Чтобы определить смысл и тип каждого столбца., Название поля не всегда однозначно.]
          - [Чем ограничение отличается от вывода?, Ограничение описывает границы достоверности данных., Вывод отвечает на аналитический вопрос.]
        task:
          answer_type: choice
          prompt: Как сформулировать зерно таблицы, где уникальный order_id обозначает заказ?
          options: [Одна строка — один заказ, Одна строка — один клиент, Одна строка — один месяц]
          expected: [Одна строка — один заказ]
          reference: Одна строка описывает один заказ.
    project:
      topic_id: foundations.data-passport
      title: Паспорт датасета продаж
      prompt: >-
        Подготовьте паспорт учебной таблицы продаж: источник и период, зерно, ключ,
        словарь пяти полей, количество строк и пять измеримых проверок качества.
        Для каждой найденной проблемы укажите количество и пример.
      reference: В хорошем паспорте явно разделены описание данных, результаты проверок и ограничения. Проверки покрывают ключ, пропуски, типы, диапазоны и допустимые категории.
      options: [Паспорт с зерном, ключом, словарём полей и измеримыми проверками, Только диаграмма продаж без описания данных, Копия исходной таблицы без проверок]
      expected: [Паспорт с зерном, ключом, словарём полей и измеримыми проверками]

  - week: 2
    title: Таблицы — базовые вычисления и очистка
    outcome: Очистить таблицу и построить воспроизводимый расчёт без ручного копирования значений.
    days:
      - day: 1
        topic_id: spreadsheets.formulas
        title: Формулы и порядок вычислений
        minutes: 6
        body: |
          # Расчёт должен жить в формуле

          Формула начинается со знака `=` и ссылается на ячейки, а не переписывает их значения. Операции выполняются с обычным приоритетом: скобки, степени, умножение/деление, сложение/вычитание.

          Для строки заказа `=C2*D2` вычисляет выручку из количества и цены. Если исходные данные изменятся, результат пересчитается. Проверяйте формулу на нескольких строках, включая ноль и необычно большое значение.
        check_question: Почему ссылка =C2*D2 лучше вручную введённой суммы?
        check_answers: [она пересчитывается, формула пересчитывается, зависит от исходных данных, обновляется автоматически]
        check_options: [Формула пересчитывается при изменении исходных данных, Формула всегда округляет результат, Ручную сумму нельзя сохранить]
        knowledge:
          - [С какого знака начинается формула?, =, Так приложение отличает расчёт от текста.]
          - [Что вычисляется раньше сложения?, Умножение и деление., Скобки позволяют изменить порядок.]
          - [Почему нельзя вводить итог вручную?, Он не обновится при изменении данных., Формула сохраняет происхождение результата.]
          - [Как проверить новую формулу?, На обычном и граничных примерах., Ноль и крупное значение выявляют ошибки.]
          - [Что означает ошибка деления на ноль?, Знаменатель равен нулю или пуст., Причину нужно обработать явно.]
        task:
          answer_type: choice
          prompt: Количество равно 4, цена — 750. Чему равна выручка по формуле количество × цена?
          options: ["3000", "754", "187.5"]
          expected: ["3000", "3 000"]
          reference: 4 × 750 = 3000.
      - day: 2
        topic_id: spreadsheets.references
        title: Относительные и абсолютные ссылки
        minutes: 7
        body: |
          # Что должно сдвигаться при копировании

          Относительная ссылка `C2` меняется при копировании формулы. Абсолютная `$F$1` остаётся закреплённой. Смешанные ссылки `$F1` и `F$1` фиксируют только столбец или строку.

          Если цена в `C2`, количество в `D2`, а ставка НДС одна для всей таблицы в `F1`, формула может быть `=C2*D2*$F$1`. Перед протягиванием решите для каждой ссылки, должна ли она двигаться.
        check_question: Какая запись полностью закрепляет ячейку F1?
        check_answers: [$F$1, "\u0024F\u00241"]
        check_options: [$F$1, F1, $F1]
        knowledge:
          - [Как ведёт себя C2 при копировании вниз?, Становится C3., Это относительная ссылка.]
          - [Как записать абсолютную ссылку на F1?, $F$1, Закреплены и столбец и строка.]
          - [Что фиксирует $F1?, Столбец F., Номер строки может изменяться.]
          - [Что фиксирует F$1?, Первую строку., Буква столбца может изменяться.]
          - [Когда полезна абсолютная ссылка?, Для общей ставки или параметра., Одна константа используется во многих строках.]
        task:
          answer_type: choice
          prompt: Какая ссылка на ячейку B1 не изменится при копировании формулы ни вниз, ни вправо?
          options: [$B$1, B1, B$1]
          expected: [$B$1]
          reference: Абсолютная ссылка записывается как $B$1.
      - day: 3
        topic_id: spreadsheets.sort-filter
        title: Сортировка и фильтры без искажения таблицы
        minutes: 6
        body: |
          # Отбирайте строки, не разрушая связи

          Фильтр временно скрывает строки по условию; сортировка меняет их порядок. Сортировать нужно весь диапазон, иначе значения разных столбцов перестанут относиться к одной записи.

          Перед операцией убедитесь, что есть одна строка заголовков, нет пустых разделительных строк и выбран весь набор. После фильтра отличайте видимые строки от общего числа записей.
        check_question: Почему опасно сортировать только один столбец таблицы?
        check_answers: [строки рассинхронизируются, данные рассинхронизируются, нарушатся связи между столбцами, значения перестанут относиться к одной записи]
        check_options: [Значения перестанут относиться к исходным строкам, Формулы станут текстом, Файл обязательно удалится]
        knowledge:
          - [Что делает фильтр?, Временно показывает строки по условию., Остальные строки не удаляются.]
          - [Что делает сортировка?, Меняет порядок строк., Значения внутри строки должны двигаться вместе.]
          - [Как избежать рассинхронизации?, Сортировать весь диапазон., Один столбец отдельно сортировать нельзя.]
          - [Зачем нужна одна строка заголовков?, Она задаёт имена полей для фильтра., Сложные шапки мешают табличным операциям.]
          - [Удаляет ли фильтр данные?, Нет., Он меняет только видимость строк.]
        task:
          answer_type: choice
          prompt: Что безопаснее сделать перед сортировкой продаж по сумме?
          options: [Выделить только сумму, Выделить всю таблицу, Скопировать суммы вручную]
          expected: [Выделить всю таблицу]
          reference: Вся строка должна перемещаться вместе, поэтому сортируют полный диапазон.
      - day: 4
        topic_id: spreadsheets.cleaning
        title: Очистка текста, чисел и дат
        minutes: 7
        body: |
          # Приведите значения к одному правилу

          Пробелы, разный регистр и невидимые символы создают ложные категории. `TRIM`/`СЖПРОБЕЛЫ` убирает лишние пробелы, функции регистра стандартизируют написание. Числа с валютой сначала очищают, затем преобразуют в числовой тип.

          Даты проверяют особенно внимательно: строка, похожая на дату, может оставаться текстом. Сохраните исходный столбец и создайте очищенный рядом — это делает преобразование проверяемым.
        check_question: Почему исходный столбец лучше сохранить рядом с очищенным?
        check_answers: [для проверки, чтобы проверить преобразование, для воспроизводимости, чтобы сравнить исходные данные]
        check_options: [Чтобы сравнить результат с исходными данными, Чтобы скрыть ошибки форматирования, Чтобы уменьшить число строк]
        knowledge:
          - [Что исправляет TRIM?, Лишние пробелы., Пробелы создают разные категории с одинаковым видом.]
          - [Зачем стандартизировать регистр?, Чтобы одинаковые категории совпадали., «Москва» и «МОСКВА» иначе могут считаться разными.]
          - [Что сделать с «1 200 руб.»?, Удалить текст и преобразовать в число., Только затем значение можно суммировать.]
          - [Как проверить настоящую дату?, Изменить формат и выполнить расчёт с датой., Текст не ведёт себя как дата.]
          - [Почему не перезаписывать исходник?, Нужна возможность сравнения и отката., Очистка должна быть воспроизводимой.]
        task:
          answer_type: choice
          prompt: Какой подход к очистке безопаснее?
          options: [Перезаписать исходный столбец, Создать очищенный столбец рядом, Исправлять только видимые ошибки вручную]
          expected: [Создать очищенный столбец рядом]
          reference: Отдельный очищенный столбец сохраняет исходные данные для сравнения.
      - day: 5
        topic_id: spreadsheets.basic-metrics
        title: Сумма, среднее, медиана и доля
        minutes: 7
        body: |
          # Метрика отвечает на конкретный вопрос

          Сумма показывает общий объём, среднее — объём на наблюдение, медиана — центральное значение, устойчивое к выбросам. Доля равна части, делённой на целое; заранее определите знаменатель.

          Набор `100, 100, 100, 100, 4600` имеет среднее 1000, но медиану 100. Поэтому для «типичного» заказа полезно смотреть обе метрики и распределение, а не выбирать функцию по привычке.
        check_question: Какая метрика устойчивее к одному очень крупному выбросу?
        check_answers: [медиана]
        check_options: [Медиана, Среднее, Сумма]
        knowledge:
          - [Что показывает сумма?, Общий объём., Она зависит от числа наблюдений.]
          - [Что показывает среднее?, Сумму на одно наблюдение., Выбросы могут сильно его изменить.]
          - [Что показывает медиана?, Центральное упорядоченное значение., Половина наблюдений не больше медианы.]
          - [Как вычислить долю?, Часть разделить на целое., Знаменатель должен соответствовать вопросу.]
          - [Почему сравнивают среднее и медиану?, Расхождение указывает на асимметрию или выбросы., Одна метрика скрывает форму распределения.]
        task:
          answer_type: choice
          prompt: Найдите медиану набора 2, 3, 3, 5, 100.
          options: ["3", "22.6", "5"]
          expected: ["3"]
          reference: После упорядочивания центральное третье значение равно 3.
    project:
      topic_id: spreadsheets.cleaning
      title: Очистка таблицы заказов
      prompt: Создайте очищенную копию учебной таблицы заказов. Сохраните исходные столбцы, стандартизируйте города, преобразуйте суммы и даты, отметьте дубликаты, посчитайте пропуски и добавьте контрольные итоги до и после очистки.
      reference: Результат содержит лист raw, лист clean, журнал правил очистки и проверки числа строк, суммы и уникальности ключа.
      options: [Raw и clean отдельно, журнал правил и контрольные итоги, Только вручную исправленный лист без raw, Только итоговая сумма без проверок]
      expected: [Raw и clean отдельно, журнал правил и контрольные итоги]

  - week: 3
    title: Таблицы — условия, агрегации и поиск
    outcome: Собрать расчёт показателей по условиям и сводный отчёт из нескольких справочников.
    days:
      - day: 1
        topic_id: spreadsheets.logic
        title: IF, AND и OR
        minutes: 7
        body: |
          # Переведите бизнес-правило в условие

          `IF`/`ЕСЛИ` возвращает один результат, когда условие истинно, и другой — когда ложно. `AND` требует выполнения всех условий, `OR` — хотя бы одного.

          Правило «крупный заказ — сумма не меньше 10 000 и оплата подтверждена» состоит из двух проверок, соединённых `AND`. Границы (`>` или `>=`) фиксируйте явно и тестируйте на значении ровно 10 000, пустой ячейке и ошибочном статусе.
        check_question: Какую функцию используют, когда должны выполняться все условия?
        check_answers: [AND, И]
        check_options: [AND, OR, SUM]
        knowledge:
          - [Что делает IF?, Выбирает результат по условию., У функции есть ветви истина и ложь.]
          - [Когда нужен AND?, Когда истинны все условия., Одного выполненного условия недостаточно.]
          - [Когда нужен OR?, Когда достаточно любого условия., Он истинен при хотя бы одном совпадении.]
          - [Чем >= отличается от >?, Первое включает границу., Для суммы ровно 10000 ответы различаются.]
          - [Какие тесты нужны условию?, Граница, пустое и обычные значения., Они выявляют неоднозначное бизнес-правило.]
        task:
          answer_type: choice
          prompt: Заказ считается срочным, если priority = high И paid = yes. Какой оператор связывает условия?
          options: [AND, OR, SUM]
          expected: [AND]
          reference: Оба условия обязательны, значит нужен AND.
      - day: 2
        topic_id: spreadsheets.conditional-aggregates
        title: SUMIF(S) и COUNTIF(S)
        minutes: 7
        body: |
          # Считайте только подходящие строки

          `COUNTIF` считает строки по одному условию, `COUNTIFS` — по нескольким. `SUMIF` и `SUMIFS` суммируют меру только для строк, удовлетворяющих критериям.

          Разделяйте диапазон условия и диапазон суммы. В `SUMIFS(amount, city, "Казань", status, "paid")` все диапазоны должны иметь одинаковую длину. Сверьте результат с фильтром и общей суммой.
        check_question: Какая функция суммирует значения по нескольким условиям?
        check_answers: [SUMIFS, СУММЕСЛИМН]
        check_options: [SUMIFS, SUM, COUNTIF]
        knowledge:
          - [Что возвращает COUNTIF?, Количество совпавших строк., Значения не суммируются.]
          - [Что возвращает SUMIF?, Сумму по одному условию., Критерий определяет включённые строки.]
          - [Когда нужен SUMIFS?, При нескольких условиях., Например город и статус оплаты.]
          - [Какими должны быть диапазоны?, Одинакового размера., Иначе строки не сопоставляются.]
          - [Как быстро проверить результат?, Сравнить с фильтром и общим итогом., Условная сумма не должна превышать общую при неотрицательных значениях.]
        task:
          answer_type: choice
          prompt: Оплаченные заказы имеют суммы 100, 250 и 150, неоплаченный — 900. Чему равна SUMIF по статусу paid?
          options: ["500", "1400", "900"]
          expected: ["500"]
          reference: 100 + 250 + 150 = 500; неоплаченный заказ исключён.
      - day: 3
        topic_id: spreadsheets.lookups
        title: XLOOKUP и контроль соединения
        minutes: 7
        body: |
          # Добавьте признак из справочника

          `XLOOKUP` ищет ключ в справочнике и возвращает связанное значение. Это табличный аналог соединения: например, по `product_id` добавить категорию товара.

          Ключ в справочнике должен быть уникален, форматы ключей — совпадать, а отсутствие совпадения — обрабатываться явно. После поиска посчитайте долю ненайденных ключей и убедитесь, что число строк основной таблицы не изменилось.
        check_question: Что нужно проверить в справочнике до XLOOKUP?
        check_answers: [уникальность ключа, ключ уникален, уникальность идентификатора]
        check_options: [Уникальность ключа, Цвет заголовков, Порядок листов]
        knowledge:
          - [Что делает XLOOKUP?, Возвращает значение по найденному ключу., Основная таблица обогащается признаком.]
          - [Почему ключ справочника должен быть уникален?, Иначе результат неоднозначен., Одному product_id должно соответствовать одно значение категории.]
          - [Почему 001 и 1 могут не совпасть?, У ключей разный формат или тип., Идентификаторы нужно нормализовать.]
          - [Как обработать ненайденный ключ?, Вернуть явную метку и посчитать такие строки., Пустота не должна скрывать проблему.]
          - [Какой контроль нужен после поиска?, Число строк не изменилось., Поиск не должен терять заказы.]
        task:
          answer_type: choice
          prompt: После XLOOKUP найдено 97 из 100 product_id. Что нужно отразить в проверке качества?
          options: [Три ненайденных ключа, Только 97 найденных, Ничего]
          expected: [Три ненайденных ключа]
          reference: Ненайденные ключи — явная проблема покрытия справочника.
      - day: 4
        topic_id: spreadsheets.pivots
        title: Сводные таблицы
        minutes: 7
        body: |
          # Быстрый разрез меры по категориям

          Сводная таблица группирует строки: измерения помещают в строки/столбцы, меры — в значения, ограничения — в фильтры. Всегда проверяйте способ агрегации: сумма, количество и среднее отвечают на разные вопросы.

          Источник должен быть прямоугольной таблицей с одной строкой заголовков. После обновления raw-данных обновите сводную и сверьте общий итог с независимой формулой.
        check_question: Куда в сводной обычно помещают выручку?
        check_answers: [в значения, значения, в область значений]
        check_options: [В область значений, В название файла, В примечание ячейки]
        knowledge:
          - [Что является измерением?, Категория для разреза., Например город или месяц.]
          - [Что является мерой?, Числовой показатель для агрегации., Например сумма выручки.]
          - [Почему важно проверить агрегацию?, Среднее и сумма дают разные смыслы., Приложение может выбрать функцию автоматически.]
          - [Каким должен быть источник?, Прямоугольным с одной шапкой., Объединённые ячейки мешают обновлению.]
          - [Что сделать после изменения raw?, Обновить сводную и сверить итог., Старая сводная может не включить новые строки.]
        task:
          answer_type: choice
          prompt: Нужно получить выручку по городам. Что поместить в строки и значения сводной?
          options: [Строки — город; значения — сумма выручки, Строки — выручка; значения — город, Только фильтр]
          expected: [Строки — город; значения — сумма выручки]
          reference: Город задаёт разрез, выручка является суммируемой мерой.
      - day: 5
        topic_id: spreadsheets.reproducible-report
        title: Воспроизводимый табличный отчёт
        minutes: 7
        body: |
          # Отделите вход, обработку и результат

          Надёжная книга содержит отдельные слои: `raw` для неизменённых данных, `clean` для явных преобразований, `calc` для расчётов и `report` для итогов. Параметры и словари хранятся отдельно, а не зашиваются во множество формул.

          Добавьте контрольные ячейки: число строк, сумму ключевой меры, количество уникальных ключей и ошибок поиска. README на первом листе объясняет источник, дату обновления и порядок пересчёта.
        check_question: На каком листе сохраняют исходные данные без ручных исправлений?
        check_answers: [raw, на листе raw, исходные данные]
        check_options: [raw, clean, report]
        knowledge:
          - [Что хранит raw?, Неизменённый входной набор., Это точка для повторного запуска.]
          - [Что хранит clean?, Явно очищенные поля., Исходные значения остаются доступны.]
          - [Что хранит report?, Итоговые показатели и графики., Технические расчёты не должны заслонять вывод.]
          - [Зачем выносить параметры?, Чтобы менять правило в одном месте., Захардкоженные значения трудно проверить.]
          - [Какие контрольные итоги нужны?, Строки, сумма, ключи и ошибки., Они обнаруживают потерю или удвоение данных.]
        task:
          answer_type: choice
          prompt: Каков правильный порядок четырёх слоёв воспроизводимой рабочей книги?
          options: [raw → clean → calc → report, report → raw → clean → calc, clean → report → raw → calc]
          expected: [raw → clean → calc → report]
          reference: Raw → clean → calc → report.
    project:
      topic_id: spreadsheets.reproducible-report
      title: Аудит продаж с формулами и сводной
      prompt: Соберите книгу raw → clean → calc → report. Добавьте категории из справочника, рассчитайте выручку и статус заказа, постройте сводную по городам и категориям и добавьте минимум четыре контрольных итога.
      reference: Итог пересчитывается после замены raw-данных, не содержит ручных итогов и явно показывает ненайденные ключи и расхождения контролей.
      options: [Книга raw → clean → calc → report с контролями и ненайденными ключами, Один лист с вручную введёнными итогами, Только сводная без исходных данных и проверок]
      expected: [Книга raw → clean → calc → report с контролями и ненайденными ключами]

  - week: 4
    title: Визуализация и завершённый табличный отчёт
    outcome: Подготовить понятный отчёт с корректными графиками, проверками и кратким бизнес-выводом.
    days:
      - day: 1
        topic_id: spreadsheets.chart-choice
        title: Выбор графика по вопросу
        minutes: 7
        body: |
          # Сначала вопрос, затем график

          Для динамики во времени подходит линия, для сравнения категорий — столбцы, для распределения — гистограмма, для связи двух чисел — точечная диаграмма. Круговая диаграмма допустима только для малого числа частей одного целого.

          Один график должен отвечать на один вопрос. Заголовок формулируйте как наблюдение, подпишите единицы и период, а лишние цвета и 3D удалите.
        check_question: Какой график обычно выбирают для динамики выручки по месяцам?
        check_answers: [линейный, линия, линейный график]
        check_options: [Линейный график, Круговая диаграмма, Таблица без временной оси]
        knowledge:
          - [Какой график показывает динамику?, Линейный., Ось X сохраняет порядок времени.]
          - [Как сравнить категории?, Столбчатой диаграммой., Длины столбцов легко сопоставлять.]
          - [Как показать распределение?, Гистограммой., Она группирует числовые значения по интервалам.]
          - [Как показать связь двух чисел?, Точечной диаграммой., Каждая точка представляет наблюдение.]
          - [Что должен сообщать заголовок?, Вопрос или ключевое наблюдение., «График 1» не помогает читателю.]
        task:
          answer_type: choice
          prompt: Какой график выбрать для сравнения выручки десяти городов?
          options: [Столбчатый, Линейный без временной оси, Круговой из десяти секторов]
          expected: [Столбчатый]
          reference: Для сравнения категорий наиболее читаемы длины столбцов.
      - day: 2
        topic_id: spreadsheets.chart-integrity
        title: Честные оси и визуальные ошибки
        minutes: 7
        body: |
          # Не усиливайте разницу оформлением

          У столбчатой диаграммы числовая ось обычно начинается с нуля: длина кодирует величину. Обрезанная ось способна сделать малое отличие огромным. Для линии ненулевой минимум иногда допустим, но его нужно ясно показать.

          Не используйте 3D, двойную ось без необходимости и несогласованные цвета. Сверяйте значения на графике с таблицей и проверяйте, не исключил ли фильтр важные строки.
        check_question: Почему столбчатую ось обычно начинают с нуля?
        check_answers: [чтобы длины не искажали разницу, длина показывает величину, чтобы не преувеличивать различия, для честного сравнения]
        check_options: [Чтобы длины столбцов честно отражали величины, Чтобы увеличить число категорий, Чтобы скрыть подписи данных]
        knowledge:
          - [Почему опасна обрезанная ось столбцов?, Она преувеличивает различия., Длина столбца воспринимается от нулевой базы.]
          - [Когда ненулевой минимум допустим?, Иногда для линии при явной маркировке., Контекст изменения должен оставаться видимым.]
          - [Почему вреден 3D?, Перспектива искажает размеры., Декор мешает точному сравнению.]
          - [Чем опасна двойная ось?, Масштабы можно подобрать для ложной связи., Лучше разделить графики или явно обосновать.]
          - [Что сверить после построения?, Значения, фильтры, единицы и период., График наследует ошибки источника.]
        task:
          answer_type: choice
          prompt: Продажи выросли со 100 до 102. Какая настройка столбчатого графика не преувеличит рост?
          options: [Ось от 0, Ось от 99.5, 3D-столбцы]
          expected: [Ось от 0]
          reference: Нулевая база сохраняет пропорцию длин 100 и 102.
      - day: 3
        topic_id: spreadsheets.dashboard-layout
        title: Иерархия простого дашборда
        minutes: 7
        body: |
          # Ведите читателя от ответа к деталям

          Сверху разместите 3–5 ключевых показателей с периодом и сравнением, ниже — динамику и основные разрезы, затем детали. Фильтры должны быть немногочисленными и менять все связанные элементы предсказуемо.

          Используйте один формат чисел, стабильные цвета категорий и визуальное выравнивание. Под каждым показателем должно быть понятно, как он рассчитан и когда обновлены данные.
        check_question: Что обычно размещают в верхней части дашборда?
        check_answers: [ключевые показатели, KPI, 3–5 ключевых показателей, основные метрики]
        check_options: [Ключевые показатели, Полную сырую таблицу, Технический журнал формул]
        knowledge:
          - [Что находится сверху дашборда?, Ключевые показатели., Читатель сначала получает общий ответ.]
          - [Что размещают ниже KPI?, Динамику и основные разрезы., Они объясняют изменение итогов.]
          - [Сколько фильтров нужно?, Только необходимые для решений., Избыток усложняет интерпретацию.]
          - [Почему цвета должны быть стабильны?, Одна категория сохраняет значение во всех графиках., Иначе читатель заново расшифровывает легенду.]
          - [Что указать рядом с метрикой?, Период, единицы и правило расчёта., Число без контекста неоднозначно.]
        task:
          answer_type: choice
          prompt: Каков правильный порядок трёх уровней дашборда сверху вниз?
          options: [KPI → динамика и разрезы → детали, Детали → raw → KPI, Фильтры → детали → название файла]
          expected: [KPI → динамика и разрезы → детали]
          reference: KPI → динамика и основные разрезы → детализация.
      - day: 4
        topic_id: spreadsheets.validation
        title: Валидация ввода и обработка ошибок
        minutes: 7
        body: |
          # Предотвращайте ошибку до расчёта

          Проверка данных ограничивает ввод списком, диапазоном или типом. Выпадающий список снижает число вариантов написания статуса. Условное форматирование помогает увидеть нарушение, но не исправляет его.

          `IFERROR` может дать понятное сообщение, однако не должен молча превращать любую ошибку в ноль. Сначала определите ожидаемые ошибки, посчитайте их и покажите контрольный индикатор качества.
        check_question: Почему нельзя бездумно заменять все ошибки нулём через IFERROR?
        check_answers: [это скрывает ошибки, ноль и ошибка имеют разный смысл, потеряется причина ошибки, ошибки станут незаметны]
        check_options: [Ноль и ошибка имеют разный смысл, IFERROR удаляет весь файл, Ноль нельзя показывать на графике]
        knowledge:
          - [Что даёт выпадающий список?, Ограниченный словарь допустимых значений., Это предотвращает варианты написания.]
          - [Что делает условное форматирование?, Визуально отмечает условие., Оно не меняет исходное значение.]
          - [Что делает IFERROR?, Подменяет результат при ошибке., Подмена должна сохранять смысл проблемы.]
          - [Почему ошибка не равна нулю?, Ноль может быть валидным измерением., Ошибка означает, что расчёт не получен.]
          - [Как контролировать ошибки?, Считать и показывать их количество., Скрытая ошибка опаснее явной.]
        task:
          answer_type: choice
          prompt: Как уменьшить варианты «оплачен», «Оплачен» и «paid» в поле статуса?
          options: [Выпадающий список, Цвет шрифта, Ручное исправление в отчёте]
          expected: [Выпадающий список]
          reference: Валидация по списку ограничивает ввод единым словарём.
      - day: 5
        topic_id: spreadsheets.business-summary
        title: Вывод, доказательство и ограничение
        minutes: 7
        body: |
          # Завершите анализ решением

          Хороший итог содержит: ответ на вопрос, 2–3 числа-доказательства, интерпретацию, ограничение и рекомендуемое действие. Не пересказывайте все графики и не называйте корреляцию причиной.

          Формула: «За период X показатель изменился на Y; основной вклад дал сегмент Z. Рекомендуем A. Вывод ограничен B, поэтому проверим C». Читатель должен отличить измеренный факт от предположения.
        check_question: Что кроме вывода и доказательства обязательно назвать для честной рекомендации?
        check_answers: [ограничение, ограничения, границы анализа, неопределенность]
        check_options: [Ограничение анализа, Цвет диаграммы, Имя автора формулы]
        knowledge:
          - [С чего начинается итог?, С ответа на бизнес-вопрос., Детали идут после решения.]
          - [Чем подкрепляют вывод?, Двумя-тремя релевантными числами., График без чисел допускает разное чтение.]
          - [Что такое ограничение?, Причина не обобщать вывод безусловно., Например неполный период или пропуски.]
          - [Почему корреляция не доказывает причину?, Возможны другие факторы и обратная связь., Нужен дизайн причинной проверки.]
          - [Чем заканчивается записка?, Действием или следующей проверкой., Анализ должен помогать принять решение.]
        task:
          answer_type: choice
          prompt: Какие пять частей образуют краткий аналитический итог?
          options: [Ответ → доказательства → интерпретация → ограничение → действие, Заголовок → таблица → цвет → шрифт → подпись, Raw → clean → формула → фильтр → файл]
          expected: [Ответ → доказательства → интерпретация → ограничение → действие]
          reference: Ответ → доказательства → интерпретация → ограничение → рекомендуемое действие.
    project:
      topic_id: spreadsheets.business-summary
      title: Воспроизводимый отчёт по продажам
      prompt: Подготовьте итоговую книгу с листами README, raw, clean, calc и report. На report разместите 3–5 KPI, динамику, два категориальных разреза и фильтры. Добавьте контроли качества и краткий вывод с доказательствами, ограничением и действием.
      reference: Отчёт пересчитывается после замены raw, графики используют честные оси, KPI имеют период и единицы, а контрольные суммы и ошибки поиска видны читателю.
      options: [Воспроизводимая книга с KPI, честными графиками, контролями и ограничением, Набор статичных картинок без raw и проверок, Один KPI без периода, единиц и пояснения]
      expected: [Воспроизводимая книга с KPI, честными графиками, контролями и ограничением]
